<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Snake</h1>

    <div id="startScreen">
        <p>Press Start to play</p>
        <button id="startButton">Start</button>
    </div>

    <div id="gameScreen" hidden>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="pauseButton">Pause</button>
        <p id="score"></p>
        <p id="highScore"></p>
    </div>

    <div id="gameOverScreen" hidden>
        <p id="info"></p>
        <p id="finalScore"></p>
        <p id="highScoreFinal"></p>
        <button id="restartButton">Restart</button>
    </div>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let gameState = "start";

        const startScreen = document.getElementById("startScreen");
        const gameScreen = document.getElementById("gameScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");

        const startButton = document.getElementById("startButton");
        const restartButton = document.getElementById("restartButton");
        const pauseButton = document.getElementById("pauseButton");

        const showScreen = (screen) => {
            startScreen.hidden = screen !== "start";
            gameScreen.hidden = screen !== "playing";
            gameOverScreen.hidden = screen !== "gameOver";
        };

        showScreen(gameState);

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        let snakeBodyColor;
        let snakeHeadColor;
        let flowerPetalColor;
        let flowerCenterColor;

        // ===== UPDATE COLORS =====
        const updateColors = () => {

            if (score < 5) {
                snakeBodyColor = "#ea99e4";
                snakeHeadColor = "#e667ca";
                flowerPetalColor = "pink";
                flowerCenterColor = "yellow";

            } else if (score < 10) {
                snakeBodyColor = "#b49ae8";
                snakeHeadColor = "#8155c9";
                flowerPetalColor = "#c99cff";
                flowerCenterColor = "#ffe066";

            } else {
                snakeBodyColor = "#ffb366";
                snakeHeadColor = "#e87532";
                flowerPetalColor = "#ff914d";
                flowerCenterColor = "#fff176";
            }
        };

        // Set initial colors
        updateColors();


        pauseButton.textContent = "Pause";

        // ===== High score =====
        let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;

        const highScoreElement = document.getElementById("highScore");
        const highScoreFinalElement = document.getElementById("highScoreFinal");

        const updateHighScore = () => {
            highScoreElement.textContent = `High Score: ${highScore}`;
            highScoreFinalElement.textContent = `High Score: ${highScore}`;
        };

        updateHighScore();

        // ===== Score =====
        const updateScore = () => {
            scoreElement.textContent = `Score: ${score}`;
        };

        const scoreElement = document.getElementById("score");
        updateScore();

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);
            
            const flowerX = food.x * gridSize + gridSize / 2;
            const flowerY = food.y * gridSize + gridSize / 2;

            ctx.fillStyle = flowerPetalColor;

            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5;

                const petalX = flowerX + Math.cos(angle) * 5;
                const petalY = flowerY + Math.sin(angle) * 5;

                ctx.beginPath();
                ctx.arc(petalX, petalY, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = flowerCenterColor;
            ctx.beginPath();
            ctx.arc(flowerX, flowerY, 3, 0, Math.PI * 2);
            ctx.fill();

            for (let index = 0; index < snake.length; index++) {
                const segment = snake[index];

                const segmentX = segment.x * gridSize + gridSize / 2;
                const segmentY = segment.y * gridSize + gridSize / 2;

                ctx.fillStyle = index % 2 === 0 ? snakeHeadColor : snakeBodyColor;

                const radius = index === 0 ? 13 : 12;

                ctx.beginPath();
                ctx.arc(segmentX, segmentY, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================


        // ===== MOVEMENT =====
        const moveSnake = () => {
            if (gameState !== "playing") {
                return;
            }

            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            if (newHead.x < 0 || newHead.x >= tileCount ||
                newHead.y < 0 || newHead.y >= tileCount ||
                snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)
            ) {
                gameState = "gameOver";

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", String(highScore));

                    updateHighScore();
                }
                
                document.getElementById("info").textContent = "Game over!"
                document.getElementById("finalScore").textContent = `Final score: ${score}`;

                showScreen("gameOver");
                return;
            }

            if (gameState === "playing") {
                snake.unshift(newHead);

                if (newHead.x === food.x && newHead.y === food.y) {
                    score += 1;
                    updateScore();
                    updateColors();
                    placeFood();
                } else {
                    snake.pop();
                }

                drawGame();
            }
        };

        setInterval(moveSnake, 200);

        // ===== Controls =====
        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp" && direction.y !== 1) {
                direction = { x: 0, y: -1 };
            } else if (event.key === "ArrowDown" && direction.y !== -1) {
                direction = { x: 0, y: 1 };
            } else if (event.key === "ArrowRight" && direction.x !== -1) {
                direction = { x: 1, y: 0 };
            } else if (event.key === "ArrowLeft" && direction.x !== 1) {
                direction = { x: -1, y: 0 };
            }
        });

        // ===== Eating and growing =====
        const placeFood = () => {
            let position;
            do {
                position = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment =>
                segment.x === position.x && segment.y === position.y
            ));
            food = position;
        };

        // ===== Restart =====
        const restart = () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            
            score = 0;
            updateScore();
            updateColors();

            gameState = "playing";
            pauseButton.textContent = "Pause";
            showScreen(gameState);

            drawGame();
        }

        // ===== Start and restart button =====
        startButton.addEventListener("click", () => {
            gameState = "playing";
            showScreen(gameState);
        });

        restartButton.addEventListener("click", () => {
            restart();
            gameState = "playing";
            showScreen(gameState);
        });

        // ===== Pause button =====
        pauseButton.addEventListener("click", () => {
            if (gameState === "playing") {
                gameState = "paused";
                pauseButton.textContent = "Resume";
            } else if (gameState === "paused") {
                gameState = "playing";
                pauseButton.textContent = "Pause";
            }
        });

    </script>

</body>
</html>
